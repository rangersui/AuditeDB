[package]
name = "elastik-core"
version = "7.2.0"
edition = "2021"
description = "Elastik V6 Engine: six verbs, one HTTP disk."
license = "MIT"
repository = "https://github.com/rangersui/Elastik"
homepage = "https://github.com/rangersui/Elastik"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
rusqlite = { version = "0.31", default-features = false }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
dashmap = "6"

[features]
default = ["bundled-sqlite", "coap", "multi-thread"]
bundled-sqlite = ["rusqlite/bundled"]
coap = []
multi-thread = ["tokio/rt-multi-thread"]

[dev-dependencies]
# `tower::util::ServiceExt::oneshot` is the standard axum testing
# pattern (axum 0.7 does not re-export it). Used by route-level
# tests in main.rs to send a synthetic Request through Router +
# middleware + world_handler so we can assert middleware-stamped
# response headers like `x-request-id`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.rut241]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "elastik-core"
path = "src/main.rs"
