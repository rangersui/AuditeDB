[package]
name = "elastik-core"
version = "7.2.0"
edition = "2021"
description = "Elastik — Audi-ted L5 storage engine. SQLite for files."
license = "MIT"
repository = "https://github.com/rangersui/Elastik"
homepage = "https://github.com/rangersui/Elastik"

[package.metadata.docs.rs]
features = ["unstable-engine"]
all-features = false

[lib]
name = "elastik_core"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", optional = true, default-features = false, features = ["http1", "tokio"] }
bytes = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures-util = { version = "0.3", optional = true }
rusqlite = { version = "0.31", default-features = false }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = { version = "0.22", optional = true }
percent-encoding = "2"
dashmap = "6"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt", "ansi", "std"] }

[features]
default = ["bundled-sqlite", "coap", "multi-thread", "unstable-engine-bin"]
bundled-sqlite = ["rusqlite/bundled"]
coap = []
multi-thread = ["tokio/rt-multi-thread"]
unstable-engine = ["dep:tracing"]
unstable-engine-bin = [
    "unstable-engine",
    "dep:axum",
    "dep:base64",
    "dep:futures-util",
    "tokio/net",
    "tokio/signal",
    "dep:tracing-subscriber",
]

[dev-dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
futures-util = "0.3"
# `tower::util::ServiceExt::oneshot` is the standard axum testing
# pattern (axum 0.7 does not re-export it). Used by route-level
# tests in main.rs to send a synthetic Request through Router +
# middleware + world_handler so we can assert middleware-stamped
# response headers like `x-request-id`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.rut241]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "elastik-core"
path = "src/main.rs"
required-features = ["unstable-engine-bin"]
