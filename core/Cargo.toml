[package]
name = "elastik-core"
version = "0.0.2"
edition = "2021"
description = "elastik bedrock — minimal HTTP+SQLite+HMAC core. Python glue lives elsewhere."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "elastik-core"
path = "src/main.rs"
