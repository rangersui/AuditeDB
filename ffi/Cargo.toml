[package]
name = "elastik-ffi"
version = "8.2.0"
edition = "2021"
description = "UniFFI adapter for Elastik's protocol-neutral Engine."
license = "MIT"
repository = "https://github.com/rangersui/Elastik"
homepage = "https://github.com/rangersui/Elastik"
publish = false

[lib]
name = "elastik_ffi"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
elastik-core = { path = "../core", default-features = false, features = ["bundled-sqlite", "unstable-engine"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.31.1", features = ["cli"] }

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
