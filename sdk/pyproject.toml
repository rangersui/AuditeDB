[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l5"
version = "8.3.0"
description = "L5 Engine: embedded audited storage for Python."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ranger Chen" }]
keywords = ["embedded", "sqlite", "audit", "storage", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rangersui/AuditeDB"
Repository = "https://github.com/rangersui/AuditeDB"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
l5 = ["_ffi/*.py", "_ffi/*.dll", "_ffi/*.so", "_ffi/*.dylib"]
