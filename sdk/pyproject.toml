[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elastik"
version = "6.4.1"
description = "Elastik V6 Engine: six verbs, one HTTP disk."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ranger Chen" }]
keywords = ["http", "pastebin", "local-first", "ai", "web-os", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []                  # stdlib only; no httpx, no requests

[project.scripts]
elastik = "elastik.__main__:main"

[project.urls]
Homepage = "https://github.com/rangersui/Elastik"
Repository = "https://github.com/rangersui/Elastik"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elastik = ["_bin/*", "_bin/**/*", "py.typed"]
