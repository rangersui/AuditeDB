[package]
name = "auditedb"
version = "8.3.0"
edition = "2021"
description = "AuditeDB server — HTTP, CoAP, MQTT, SSE adapters for the L5 Engine."
license = "MIT"
repository = "https://github.com/rangersui/AuditeDB"
homepage = "https://github.com/rangersui/AuditeDB"
publish = false

[dependencies]
l5 = { path = "../core", default-features = false, features = ["unstable-engine"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "signal"] }
tracing = "0.1"
rumqttd = { version = "=0.20.0", optional = true, default-features = false }

[features]
default = ["bundled-sqlite", "coap", "multi-thread", "unstable-engine"]
bundled-sqlite = ["l5/bundled-sqlite"]
coap = []
multi-thread = ["tokio/rt-multi-thread"]
mqtt = ["dep:rumqttd", "tokio/io-util"]
unstable-engine = []

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.13"
rusqlite = { version = "0.40", default-features = false }
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "auditedb"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.rut241]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
