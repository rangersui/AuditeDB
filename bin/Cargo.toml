[package]
name = "elastik-bin"
version = "8.0.1"
edition = "2021"
description = "Elastik server binary adapters for the elastik-core storage engine."
license = "MIT"
repository = "https://github.com/rangersui/Elastik"
homepage = "https://github.com/rangersui/Elastik"

[dependencies]
elastik-core = { path = "../core", default-features = false, features = ["unstable-engine"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
rumqttd = { version = "=0.20.0", optional = true, default-features = false }

[features]
default = ["bundled-sqlite", "coap", "multi-thread", "unstable-engine"]
bundled-sqlite = ["elastik-core/bundled-sqlite"]
coap = []
multi-thread = ["tokio/rt-multi-thread"]
mqtt = ["dep:rumqttd", "tokio/io-util"]
unstable-engine = []

[dev-dependencies]
base64 = "0.22"
dashmap = "6"
hmac = "0.12"
hex = "0.4"
rusqlite = { version = "0.31", default-features = false }
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "elastik-core"
path = "src/main.rs"
