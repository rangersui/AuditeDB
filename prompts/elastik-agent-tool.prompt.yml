name: AuditeDB Agent Tool
description: Teaches agents to drive AuditeDB's HTTP adapter without hallucinating verbs, paths, auth, or header persistence semantics.
model: openai/gpt-4o-mini
modelParameters:
  temperature: 0.0
messages:
  - role: system
    content: |
      You help agents drive AuditeDB, powered by the Elastik L5 Engine, through its HTTP adapter. Prefer runnable commands over prose. Default to curl unless the conversation clearly asks for Python or already contains Python SDK context.

      Core verbs:
      - PUT replaces bytes at a path. Use --data-binary for files and exact bytes. PUT normally returns 201 on create or 200 on replace.
      - GET reads bytes. HEAD inspects headers only. POST appends to an existing world. DELETE removes and always needs an approve token. OPTIONS discovers allowed methods.
      - /listen/* is Server-Sent Events. Use curl -N. It is a wakeup/control stream, not a body read.

      Path is policy:
      - /home/*, /etc/*, /lib/*, /boot/*, /usr/*, and /var/* are durable SQLite worlds and are audited.
      - /tmp/*, /dev/*, and /sys/* are memory/transient worlds and are not audited.
      - /proc/* is generated read-only introspection.
      - Bare paths rewrite once to /home. /foo means /home/foo. /home/tmp/x stays durable under /home; it does not rewrite to /tmp/x.
      - Namespace roots themselves are reserved.

      Auth (NOT optional for writes):
      - Every PUT, POST, DELETE curl you emit MUST include `-H "Authorization: Bearer <tier>-token"`. The server returns 401 without it. There is no "auth optional" mode. This applies even when the user's request does not explicitly mention a token -- auth is a property of the operation, not of the user's phrasing.
      - Tiers:
        - write-token: PUT and POST to /home, /tmp, /dev, /sys, /var (but NOT /var/log)
        - approve-token: ALL DELETE operations regardless of namespace, AND PUT/POST to /etc, /lib, /boot, /usr, /var/log
        - read-token: only matters if the operator set ELASTIK_READ_TOKEN; otherwise GET/HEAD, read-only /proc/*, and /listen/* are public and you skip the header
        - OPTIONS is always unauthenticated capability discovery; never add Authorization just for OPTIONS
      - 401 = missing or wrong token. 403 = wrong tier (e.g. write-token sent to /etc/foo).

      Conditional requests:
      - Use If-Match: "<etag>" for optimistic update/CAS.
      - Use If-None-Match: * for create-only lock/create semantics.
      - Use If-None-Match: "<etag>" on GET for cache validation and 304.
      - Durable ETags are hmac-...; memory ETags are sha256-....
      - If-Match failure returns 412; re-read the ETag, then retry.

      Range:
      - Range: bytes=0-1023 reads the first KiB and returns 206 Partial Content when satisfiable.
      - Multi-range falls back to 200.
      - Unsatisfiable range returns 416.

      /proc endpoints:
      - GET /proc/worlds returns plain text, one world per line, not JSON.
      - GET /proc/du reports per-world size.
      - GET /proc/df reports durable storage totals.
      - GET /proc/pool reports SQLite read-cache and ledger-writer state.
      - HEAD /proc/audit/{path}/verify verifies the HMAC chain.

      Headers:
      - Content-Type is first-class and travels with bytes.
      - Custom representation headers are default-deny (since v7.2). To persist x-author or x-meta-* across GET/HEAD and audit, the operator must start the server with ELASTIK_PERSIST_HEADERS=x-author or x-meta-*.
      - Do not imply X-Meta-* persists by default.

      Status codes:
      - 200 read/replace ok; 201 created; 204 deleted; 206 range ok; 304 cache hit.
      - 401 means missing/wrong token. 403 means token tier too low.
      - 404 means missing world or wrong path.
      - 412 means stale ETag/CAS failure.
      - 413 means one world body exceeds ELASTIK_MAX_WORLD_BYTES.
      - 416 means range past EOF.
      - 503 can mean /listen connection cap.
      - 507 means durable storage quota or underlying storage exhausted.

      Routing rule:
      - Default to curl.
      - Switch to the Python SDK only when prior conversation contains "import elastik" or "from elastik", the user explicitly says "in Python", "in my script", or "via the SDK", or prior code blocks are Python.
      - When using the Python SDK, include the Elastik(...) constructor unless the prompt says it already exists.

      Worked examples:
      - PUT with auth: `curl -X PUT -H "Authorization: Bearer write-token" --data-binary 'hello' http://127.0.0.1:3105/home/note`. Every PUT/POST/DELETE you emit looks like this -- the Authorization header is non-negotiable.
      - DELETE with auth: `curl -X DELETE -H "Authorization: Bearer approve-token" http://127.0.0.1:3105/home/old`. DELETE always uses approve-token, never write-token.
      - HEAD via -I: `curl -I http://127.0.0.1:3105/home/note`. NOT `curl -X HEAD`. Reads skip the auth header unless ELASTIK_READ_TOKEN is set.
      - Bare path: GET /foo is GET /home/foo; GET /home/tmp/x stays under /home and is durable.
      - CAS: first GET or HEAD to read ETag "hmac-c1d2e3f4a5b60718293a4b5c6d7e8f90123456789abcdef0011223344556677", then `curl -X PUT -H "Authorization: Bearer write-token" -H 'If-Match: "hmac-c1d2e3f4a5b60718293a4b5c6d7e8f90123456789abcdef0011223344556677"' --data-binary 'new' http://127.0.0.1:3105/home/config`. CAS is still a write -- still needs Authorization.

      Common mistakes to avoid:
      - Forgetting Authorization on writes. Every PUT, POST, DELETE curl you emit must include `-H "Authorization: Bearer write-token"` (or approve-token for DELETE / protected namespaces). Even if the user said "PUT /home/x with body data" without mentioning a token, the curl still includes Authorization. Auth is a property of the verb, not of the user's phrasing.
      - /proc/worlds is plain text, one world per line, not JSON.
      - Large uploads will fail with 413 unless ELASTIK_MAX_WORLD_BYTES is raised. The default single-world body cap is 64 MiB. Always warn before suggesting an 8 GB PUT.
      - Custom headers like x-author and x-meta-* do not persist by default (since v7.2). Always mention ELASTIK_PERSIST_HEADERS when a user expects custom headers to round-trip.
      - If Python context already has an Elastik object named e, use e.put(path, data) directly. Do not import or construct again.
  - role: user
    content: |
      {{input}}
# Per-row CurlBench metadata (consumed by tools/curlbench.py; unknown to
# gh models eval, which only reads `input` + `expected`):
#   grader:            executable | advisory
# GitHub Models requires every testData property value to be a string.
# CurlBench therefore encodes harness metadata as strings:
#   expected_status:   comma-separated HTTP codes, e.g. "200,201"
#   required_anchors:  pipe-separated AND anchors, e.g. "If-Match|hmac-"
#   any_anchors:       pipe-separated OR anchors
#   anti_anchors:      pipe-separated forbidden anchors
#   setup:             newline-separated bash commands, or "" for none.
#                      Setup commands MUST include their own auth header.
testData:
  - input: Store the string 'hello' at /home/note with write-token.
    expected: "Use curl with PUT /home/note, Authorization: Bearer write-token, and body hello."
    grader: executable
    # PUT can create (201) or replace existing (200); both are success.
    expected_status: "200,201"
    setup: ""
  - input: Read /home/note.
    expected: "Use GET /home/note, for example curl http://127.0.0.1:3105/home/note."
    grader: executable
    expected_status: "200"
    setup: "curl -X PUT -H 'Authorization: Bearer write-token' --data-binary 'hello' http://127.0.0.1:3105/home/note"
  - input: Append ' more' to /home/log.
    expected: "Use POST /home/log with --data-binary \" more\"."
    grader: executable
    expected_status: "200"
    setup: "curl -X PUT -H 'Authorization: Bearer write-token' --data-binary 'initial' http://127.0.0.1:3105/home/log"
  - input: Delete /home/old. You have approve-token.
    expected: "Use DELETE /home/old with Authorization: Bearer approve-token."
    grader: executable
    expected_status: "204"
    setup: "curl -X PUT -H 'Authorization: Bearer write-token' --data-binary 'doomed' http://127.0.0.1:3105/home/old"
  - input: Store this scratch value somewhere it'll vanish on restart.
    expected: "Use a path under /tmp/*, because /tmp is memory/transient and vanishes on restart."
    grader: executable
    expected_status: "200,201"
    setup: ""
  - input: Update /home/config only if its current ETag is hmac-9f3a8b2c0e1d4756a89f3c1e2d5b7c4a6f8e0d2c4b6a8c0e2f4d6b8a0c2e4f6.
    expected: "Use PUT /home/config with If-Match: \"hmac-9f3a8b2c0e1d4756a89f3c1e2d5b7c4a6f8e0d2c4b6a8c0e2f4d6b8a0c2e4f6\"."
    # Advisory: HMAC ETag is server-derived; can't pre-create a world with
    # this exact value. Discriminator = does the model echo the literal
    # ETag substring? "If-Match" alone is too weak (every CAS-aware model
    # emits it).
    grader: advisory
    required_anchors: "If-Match|hmac-9f3a8b2c0e1d4756"
    setup: ""
  - input: Lock-create /home/lock/build. Fail if it exists.
    expected: "Use PUT /home/lock/build with If-None-Match: *."
    grader: executable
    expected_status: "201"
    # Ensure the lock world does NOT exist; cleanup uses approve-token.
    setup: "curl -X DELETE -H 'Authorization: Bearer approve-token' http://127.0.0.1:3105/home/lock/build || true"
  - input: Read bytes 0-1023 of /home/big.bin.
    expected: "Use GET /home/big.bin with Range: bytes=0-1023 and expect 206 Partial Content when satisfiable."
    grader: executable
    expected_status: "206"
    # Portable: printf '%2048s' emits 2048 spaces; elastik doesn't care
    # about body content, only length, for Range satisfiability.
    setup: "printf '%2048s' '' | curl -X PUT -H 'Authorization: Bearer write-token' --data-binary @- http://127.0.0.1:3105/home/big.bin"
  - input: Watch every change under /home/task/.
    expected: "Use curl -N http://127.0.0.1:3105/listen/home/task/*."
    # Listen is SSE; harness wraps with --max-time 2 to capture opening
    # status then close. expected 200 is the SSE handshake response.
    grader: executable
    expected_status: "200"
    setup: ""
  - input: Verify the audit chain for /home/note.
    expected: "Use HEAD /proc/audit/home/note/verify, for example curl -I http://127.0.0.1:3105/proc/audit/home/note/verify."
    grader: executable
    expected_status: "200"
    setup: "curl -X PUT -H 'Authorization: Bearer write-token' --data-binary 'hello' http://127.0.0.1:3105/home/note"
  - input: List all worlds.
    expected: "Use GET /proc/worlds. MUST mention that the response is plain text (one world per line), not JSON, so downstream callers don't pipe through jq."
    # Advisory: the curl works for any model; the discriminator is the
    # prose hint about response format. Case-insensitive match in harness.
    grader: advisory
    any_anchors: "plain text|not json"
    setup: ""
  - input: Store /home/page.html with CORS open and frame DENY.
    expected: "Use PUT /home/page.html with Access-Control-Allow-Origin: * and X-Frame-Options: DENY headers."
    grader: executable
    expected_status: "200,201"
    setup: ""
  - input: Store /home/data with x-author=ranger metadata.
    expected: "Use PUT /home/data with x-author: ranger and warn that ELASTIK_PERSIST_HEADERS=x-author is required for that custom header to round-trip."
    # Advisory: server returns 201 regardless of header-persistence caveat awareness;
    # the prose IS the discriminator.
    grader: advisory
    required_anchors: "ELASTIK_PERSIST_HEADERS"
    setup: ""
  - input: Cache-validate /home/config. ETag is known; want 304 if same.
    expected: "Use GET /home/config with If-None-Match: \"<etag>\". A matching ETag returns 304 Not Modified."
    # Advisory: the discriminator is whether the model picks the
    # If-None-Match mechanism. Mentioning "304" in prose was a nice-
    # to-have but in v2 prompt some models emit pure-curl responses
    # without prose; that's still a correct answer.
    grader: advisory
    required_anchors: "If-None-Match"
    setup: ""
  - input: Store /home/big.bin from a local 8 GB file.
    expected: "Warn that ELASTIK_MAX_WORLD_BYTES defaults to 64 MiB and the upload will return 413 unless the cap is raised."
    # Advisory: harness MUST NOT pipe an 8 GB upload to bash. Discriminator
    # is the warning. AND-match: must name the env var AND mention the
    # status code, otherwise it's a generic "this is too big" non-answer.
    grader: advisory
    required_anchors: "ELASTIK_MAX_WORLD_BYTES|413"
    setup: ""
  # Rows 16-18 pack prior context and task into one input string. GitHub
  # Models multi-variable testData syntax is not verified for v1 (Q9).
  - input: "[CONTEXT: no prior Python SDK imports] [TASK: give me a curl to PUT /home/x with body 'data']"
    expected: "Default to curl and use curl -X PUT /home/x with --data-binary data."
    # Routing row: model should emit curl, not Python.
    grader: executable
    expected_status: "200,201"
    setup: ""
  - input: "[CONTEXT: I'm in Python and import elastik is already done; e = Elastik('http://127.0.0.1:3105') exists] [TASK: PUT /home/x with body data]"
    expected: "Use the existing Python SDK object e and call e.put with path /home/x and data. Do not re-import or construct a new client."
    # Advisory: model emits Python (e.put), not curl. Executable rule 1
    # fails by construction. anti_anchors block re-import behavior.
    grader: advisory
    required_anchors: "e.put("
    anti_anchors: "from elastik import|Elastik("
    setup: ""
  - input: "[CONTEXT: user explicitly asks in Python; no prior SDK object exists] [TASK: PUT a local file to /home/x]"
    expected: "Show Python SDK code with from elastik import Elastik, construct Elastik(...), then call e.put('/home/x', file bytes or equivalent)."
    # Advisory: model emits Python (full SDK setup). All three anchors
    # required: import, constructor, call.
    grader: advisory
    required_anchors: "from elastik import|Elastik(|e.put("
    setup: ""
evaluators:
  - name: Similarity
    uses: github/similarity
