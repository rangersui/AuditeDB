name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-core-assets:
    name: build core asset (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
            asset-name: elastik-core-linux-x64.zip
            npm-platform: linux
            npm-arch: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            asset-name: elastik-core-linux-arm64.zip
            npm-platform: linux
            npm-arch: arm64
          - name: macos-arm64
            os: macos-14
            rust-target: ""
            asset-name: elastik-core-darwin-arm64.zip
            npm-platform: darwin
            npm-arch: arm64
          - name: windows-x64
            os: windows-latest
            rust-target: ""
            asset-name: elastik-core-win32-x64.zip
            npm-platform: win32
            npm-arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: add rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}
      - name: install musl toolchain
        if: startsWith(matrix.rust-target, 'x86_64-unknown-linux-musl') || startsWith(matrix.rust-target, 'aarch64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build core (musl)
        if: matrix.rust-target != ''
        shell: bash
        run: |
          case "${{ matrix.rust-target }}" in
            x86_64-unknown-linux-musl)
              export CC_x86_64_unknown_linux_musl=musl-gcc
              ;;
            aarch64-unknown-linux-musl)
              export CC_aarch64_unknown_linux_musl=musl-gcc
              ;;
          esac
          cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.rust-target }}

      - name: build core (native)
        if: matrix.rust-target == ''
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: package core asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force asset | Out-Null
          Copy-Item core/target/release/elastik-core.exe asset/elastik-core.exe
          Compress-Archive -Path asset/* -DestinationPath ${{ matrix.asset-name }}

      - name: package core asset (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p asset
          if [ -n "${{ matrix.rust-target }}" ]; then
            cp "core/target/${{ matrix.rust-target }}/release/elastik-core" asset/elastik-core
          else
            cp core/target/release/elastik-core asset/elastik-core
          fi
          chmod +x asset/elastik-core
          (cd asset && zip -9 "../${{ matrix.asset-name }}" elastik-core)

      - name: upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset-name }}

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: publish npm platform package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="core/target/release/elastik-core.exe"
          elif [ -n "${{ matrix.rust-target }}" ]; then
            binary="core/target/${{ matrix.rust-target }}/release/elastik-core"
          else
            binary="core/target/release/elastik-core"
          fi
          node sdk-js/scripts/pack-platform.mjs "${{ matrix.npm-platform }}" "${{ matrix.npm-arch }}" "$binary"
          npm publish "sdk-js/core-${{ matrix.npm-platform }}-${{ matrix.npm-arch }}" --access public

  build-wheels:
    name: build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            wheel-platform-tag: ""
            wheel-platform-regex: "manylinux.*_x86_64"
          - name: macos-arm64
            os: macos-14
            wheel-platform-tag: "macosx_11_0_arm64"
            wheel-platform-regex: "macosx_.*_arm64"
          - name: windows-x64
            os: windows-latest
            wheel-platform-tag: ""
            wheel-platform-regex: "win_amd64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: show platform
        run: python -c "import platform, sys; print(sys.platform, platform.machine())"

      - name: build core
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: bundle core binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sdk/src/elastik/_bin | Out-Null
          Copy-Item core/target/release/elastik-core.exe sdk/src/elastik/_bin/elastik-core.exe

      - name: bundle core binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p sdk/src/elastik/_bin
          cp core/target/release/elastik-core sdk/src/elastik/_bin/elastik-core
          chmod +x sdk/src/elastik/_bin/elastik-core

      - name: build wheel
        env:
          ELASTIK_WHEEL_PLATFORM_TAG: ${{ matrix.wheel-platform-tag }}
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel sdk

      - name: repair linux wheel tag
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade auditwheel
          mkdir -p sdk/wheelhouse
          python -m auditwheel repair --wheel-dir sdk/wheelhouse sdk/dist/*.whl
          rm sdk/dist/*.whl
          mv sdk/wheelhouse/*.whl sdk/dist/

      - name: smoke wheel artifact
        shell: bash
        env:
          WHEEL_PLATFORM_REGEX: ${{ matrix.wheel-platform-regex }}
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import sys
          import zipfile

          wheels = glob.glob("sdk/dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, got {wheels}")
          wheel = wheels[0]
          wheel_name = os.path.basename(wheel)
          if wheel.endswith("none-any.whl"):
              raise SystemExit(f"wheel must be platform-specific, got {wheel}")
          expected = os.environ["WHEEL_PLATFORM_REGEX"]
          if not re.search(expected, wheel_name):
              raise SystemExit(f"wheel {wheel_name} does not match expected platform /{expected}/")
          if re.search(r"-linux_[^-]+\.whl$", wheel_name):
              raise SystemExit(f"PyPI rejects raw linux platform tags: {wheel_name}")
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              wheel_meta = next(name for name in names if name.endswith(".dist-info/WHEEL"))
              wheel_text = z.read(wheel_meta).decode("utf-8")
          if "Root-Is-Purelib: false" not in wheel_text:
              raise SystemExit("wheel must be platlib, not purelib")
          if any(".data/purelib/" in name for name in names):
              raise SystemExit("native wheel must not install files into purelib")
          if not any(name.endswith("elastik/_bin/elastik-core") or name.endswith("elastik/_bin/elastik-core.exe") for name in names):
              raise SystemExit("wheel does not contain elastik-core binary")
          print(wheel)
          PY

      - name: upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: elastik-wheel-${{ matrix.name }}
          path: sdk/dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: elastik-wheel-*
          path: dist
          merge-multiple: true

      - name: list wheels
        run: ls -lah dist

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-npm-client:
    name: publish npm client
    needs: build-core-assets
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: smoke js package exports
        run: |
          node -e "import('./index.mjs').then((m) => { if (typeof m.Elastik !== 'function') throw new Error('missing Elastik export') })"
          node -e "import('./start.mjs').then((m) => { if (typeof m.start !== 'function' || typeof m.resolveBinary !== 'function') throw new Error('missing start exports') })"
        working-directory: sdk-js
      - name: publish npm client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        working-directory: sdk-js
