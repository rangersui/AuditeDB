name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust-core:
    name: rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: version consistency
        run: python tools/version_consistency_check.py
      - name: audit chain verifier self-test
        run: python tools/audit_chain_verify.py --self-test
      - name: format
        working-directory: core
        run: cargo fmt --check
      - name: binary format
        working-directory: bin
        run: cargo fmt --check
      - name: ffi format
        working-directory: ffi
        run: cargo fmt --check
      - name: core no structured data
        run: python core/no_json.py core/src
      - name: core contraband
        run: >
          python core/contraband.py
          --only no_yaml
          --only no_toml_parse
          --only no_last_modified
          --only no_hardcoded_secrets
          core/src
      - name: core production clippy doctrine lint
        working-directory: core
        run: cargo clippy --locked --lib -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: binary production clippy doctrine lint
        working-directory: bin
        run: cargo clippy --locked --bin elastik-core -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: ffi production clippy doctrine lint
        working-directory: ffi
        run: cargo clippy --locked --lib -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: core production clippy doctrine lint minimal
        working-directory: core
        run: cargo clippy --locked --lib --no-default-features --features bundled-sqlite,unstable-engine -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: binary production clippy doctrine lint minimal
        working-directory: bin
        run: cargo clippy --locked --bin elastik-core --no-default-features --features bundled-sqlite,unstable-engine -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: clippy
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: binary clippy
        working-directory: bin
        run: cargo clippy --locked -- -D warnings
      - name: ffi clippy
        working-directory: ffi
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: rustdoc warnings
        working-directory: core
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --lib
      - name: unit tests
        working-directory: core
        run: cargo test --locked
      - name: binary tests
        working-directory: bin
        run: cargo test --locked
      - name: ffi tests
        working-directory: ffi
        run: cargo test --locked

  sdk-blackbox:
    name: sdk blackbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: python sdk blackbox
        run: python sdk/tests/e2e_blackbox.py
      - name: trusted shell pool
        run: python sdk/tests/test_tools.py
      - name: python compileall
        run: python -m compileall -q sdk/src sdk/tests
