name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust-core:
    name: rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: UniFFI binding consistency checker tests
        run: >
          python -m unittest discover -s tools
          -p "test_uniffi_binding_consistency.py" -v
      - name: version consistency
        run: python tools/version_consistency_check.py
      - name: audit chain verifier self-test
        run: python tools/audit_chain_verify.py --self-test
      - name: build l5 ffi native library for Python tests
        run: cargo build --locked --release --manifest-path ffi/Cargo.toml
      - name: verify FFI lockfile is unchanged
        run: git diff --exit-code -- ffi/Cargo.lock
      - name: generate Python UniFFI binding
        shell: bash
        working-directory: ffi
        run: |
          target/release/uniffi-bindgen generate target/release/libl5_ffi.so \
            --language python \
            --out-dir target/bindings/python
      - name: verify tracked Python UniFFI binding
        run: >
          python tools/uniffi_binding_consistency.py
          sdk/src/l5/_ffi/l5_ffi.py
          ffi/target/bindings/python/l5_ffi.py
      - name: stage l5 ffi library for Python tests
        run: cp ffi/target/release/libl5_ffi.so sdk/src/l5/_ffi/libl5_ffi.so
      - name: python l5 sdk smoke
        env:
          PYTHONPATH: sdk/src
        run: python tools/l5_python_smoke.py
      - name: python l5 sdk tests
        env:
          PYTHONPATH: sdk/src
        run: python -m unittest discover -s sdk/tests -v
      - name: format
        working-directory: core
        run: cargo fmt --check
      - name: binary format
        working-directory: bin
        run: cargo fmt --check
      - name: ffi format
        working-directory: ffi
        run: cargo fmt --check
      - name: core no structured data
        run: python core/no_json.py core/src
      - name: core contraband
        run: >
          python core/contraband.py
          --only no_yaml
          --only no_toml_parse
          --only no_last_modified
          --only no_hardcoded_secrets
          core/src
      - name: panic discipline scan
        run: python tools/panic_discipline_scan.py core bin ffi
      - name: core production clippy doctrine lint
        working-directory: core
        run: cargo clippy --locked --lib -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: binary production clippy doctrine lint
        working-directory: bin
        run: cargo clippy --locked --bins -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: ffi production clippy doctrine lint
        working-directory: ffi
        run: cargo clippy --locked --lib -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: ffi binaries production clippy doctrine lint
        working-directory: ffi
        run: cargo clippy --locked --bins -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: ffi production clippy doctrine lint no default features
        working-directory: ffi
        run: cargo clippy --locked --lib --no-default-features -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: ffi binaries production clippy doctrine lint no default features
        working-directory: ffi
        run: cargo clippy --locked --bins --no-default-features -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: core production clippy doctrine lint minimal
        working-directory: core
        run: cargo clippy --locked --lib --no-default-features --features bundled-sqlite,unstable-engine -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: core production clippy doctrine lint no unstable engine
        working-directory: core
        run: cargo clippy --locked --lib --no-default-features --features bundled-sqlite -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: binary production clippy doctrine lint minimal
        working-directory: bin
        run: cargo clippy --locked --bins --no-default-features --features bundled-sqlite,unstable-engine -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: binary production clippy doctrine lint no unstable engine
        working-directory: bin
        run: cargo clippy --locked --bins --no-default-features --features bundled-sqlite -- -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used -D clippy::print_stdout
      - name: clippy
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks -D clippy::unwrap_used -D clippy::expect_used
      - name: binary clippy
        working-directory: bin
        run: cargo clippy --locked --all-targets -- -D warnings -D unsafe_code -D clippy::unwrap_used -D clippy::expect_used
      - name: ffi clippy
        working-directory: ffi
        run: cargo clippy --locked --all-targets -- -D warnings -D unsafe_code -D clippy::undocumented_unsafe_blocks -D clippy::unwrap_used -D clippy::expect_used
      - name: rustdoc warnings
        working-directory: core
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --lib
      - name: unit tests
        working-directory: core
        run: cargo test --locked
      - name: binary tests
        working-directory: bin
        run: cargo test --locked
      - name: ffi tests
        working-directory: ffi
        run: cargo test --locked

  python-sdk-windows:
    name: python SDK tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: UniFFI binding consistency checker tests
        run: >
          python -m unittest discover -s tools
          -p "test_uniffi_binding_consistency.py" -v
      - name: core tests on Windows
        run: cargo test --locked --manifest-path core/Cargo.toml
      - name: binary tests on Windows
        run: cargo test --locked --manifest-path bin/Cargo.toml
      - name: FFI tests on Windows
        run: cargo test --locked --manifest-path ffi/Cargo.toml
      - name: build l5 ffi native library
        run: cargo build --locked --release --manifest-path ffi/Cargo.toml
      - name: generate Python UniFFI binding
        shell: pwsh
        working-directory: ffi
        run: |
          .\target\release\uniffi-bindgen.exe generate `
            .\target\release\l5_ffi.dll `
            --language python `
            --out-dir .\target\bindings\python
      - name: verify tracked Python UniFFI binding
        run: >
          python tools/uniffi_binding_consistency.py
          sdk/src/l5/_ffi/l5_ffi.py
          ffi/target/bindings/python/l5_ffi.py
      - name: stage l5 ffi library
        shell: pwsh
        run: Copy-Item ffi\target\release\l5_ffi.dll sdk\src\l5\_ffi\l5_ffi.dll -Force
      - name: python l5 sdk smoke
        env:
          PYTHONPATH: sdk/src
        run: python tools/l5_python_smoke.py
      - name: python l5 sdk tests
        env:
          PYTHONPATH: sdk/src
        run: python -m unittest discover -s sdk/tests -v
