name: supply-chain

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust-supply-chain:
    name: rust supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install cargo supply-chain tools
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo install cargo-deny --locked --version 0.19.8
          cargo install cargo-machete --locked --version 0.9.2
      - name: supply-chain gates
        run: python tools/supply_chain_check.py ci
